[package]
name = "livecaptions-r"
version = "0.12.0"
description = "LiveCaptions Real-time Translator"
authors = ["fonlan"]
edition = "2021"

[[bin]]
name = "LiveCaptionsR"
path = "src/main.rs"

[lib]
name = "livecaptions_r_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full", "sync"] }
anyhow = "1"
once_cell = "1"
reqwest = { version = "0.12", features = ["json", "socks"] }
urlencoding = "2"
dirs = "5"
windows = { version = "0.58", features = [
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_Foundation",
    "Win32_UI_Accessibility",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }
rusqlite = { version = "0.38.0", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "ansi"] }
tracing-appender = "0.2"
tracing-rolling-file = { version = "0.1", features = ["non-blocking"] }
thiserror = "2.0.18"

[profile.release]
codegen-units = 1 # 最大化优化，牺牲编译速度
lto = true        # 开启链接时优化 (Link Time Optimization)
opt-level = "z"   # 针对体积进行优化 (如果追求极致性能可改为 3)
panic = "abort"   # 移除 Panic 回溯信息，减小体积
strip = true      # 自动剥离符号表
