<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LiveCaptionsR</title>
    <style>
      :root {
        color-scheme: dark;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: transparent;
        color: #e0e6ed;
        overflow: hidden;
      }

      body {
        padding: 0;
      }

      .shell {
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        max-width: none;
        border: 1px solid rgba(148, 163, 184, 0.28);
        border-radius: 12px;
        background: linear-gradient(145deg, rgba(22, 27, 40, 0.95), rgba(15, 17, 26, 0.95));
        box-shadow: 0 22px 48px rgba(0, 0, 0, 0.45);
        padding: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0 18px;
      }

      .dot {
        width: 12px;
        height: 12px;
        border-radius: 999px;
        background: #00f2ea;
        box-shadow: 0 0 12px rgba(0, 242, 234, 0.9);
        animation: pulse 1.2s ease-in-out infinite;
      }

      .title {
        margin: 0;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      .subtitle {
        margin: 8px 18px 0;
        color: #94a3b8;
        font-size: 13px;
      }

      .bar {
        margin: 16px 18px 0;
        width: calc(100% - 36px);
        height: 4px;
        border-radius: 99px;
        overflow: hidden;
        background: rgba(148, 163, 184, 0.2);
      }

      .bar::after {
        content: "";
        display: block;
        width: 32%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #00f2ea, #00c0ff);
        animation: slide 1.2s ease-in-out infinite;
      }

      @keyframes slide {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(320%);
        }
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.45;
          transform: scale(0.85);
        }
      }
    </style>
  </head>
  <body>
    <section class="shell">
      <div class="header">
        <div class="dot"></div>
        <h1 class="title">LiveCaptionsR</h1>
      </div>
      <p class="subtitle">Initializing desktop runtime...</p>
      <div class="bar"></div>
    </section>
  </body>
</html>
