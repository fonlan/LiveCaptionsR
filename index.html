<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LiveCaptionsR</title>
    <style>
      :root {
        color-scheme: dark;
      }

      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        background: #0f111a;
        color: #e0e6ed;
        font-family: "Segoe UI", system-ui, sans-serif;
        overflow: hidden;
      }

      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 12px;
        background: radial-gradient(circle at 50% 30%, rgba(0, 242, 234, 0.09), transparent 65%), #0f111a;
        transition: opacity 0.24s ease;
        z-index: 9999;
      }

      #boot-splash .boot-spinner {
        width: 26px;
        height: 26px;
        border: 2px solid rgba(224, 230, 237, 0.25);
        border-top-color: #00f2ea;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }

      #boot-splash .boot-label {
        font-size: 13px;
        letter-spacing: 0.08em;
        color: #94a3b8;
      }

      body.app-booted #boot-splash {
        opacity: 0;
        pointer-events: none;
      }

      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div id="boot-splash" role="status" aria-live="polite">
        <div class="boot-spinner"></div>
        <div class="boot-label">Loading LiveCaptionsR...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
